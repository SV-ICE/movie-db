<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Movies</title>
    <link rel="stylesheet" href="./src/index.css">
    <!-- Скрипт для GitHub Pages SPA -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
</head>
<body>
    <!-- Анимированный фон -->
    <div class="background">
        <div class="film-strip strip1"></div>
        <div class="film-strip strip2"></div>
        <div class="film-strip strip3"></div>
        
        <div class="spotlight spotlight1"></div>
        <div class="spotlight spotlight2"></div>
        <div class="spotlight spotlight3"></div>
        
        <div class="stars" id="stars"></div>
        
        <div class="gradient-overlay"></div>
    </div>

    <!-- Ваше React приложение -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
        // Создаем звёзды
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            starsContainer.appendChild(star);
        }

        // Анимация при вводе
        const searchBox = document.querySelector('.search-box');
        searchBox.addEventListener('input', (e) => {
            if (e.target.value) {
                e.target.style.transform = 'scale(1.02)';
            } else {
                e.target.style.transform = 'scale(1)';
            }
        });
    </script>
</body>
</html>
